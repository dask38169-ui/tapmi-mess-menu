<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAPMI Mess Menu Explorer</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#15202b;--muted:#667085;--line:#d9dee8;--accent:#6d5dfc;--accent2:#00a982;--shadow:0 14px 40px rgba(25,35,58,.12);--food:#32d583;--drink:#4aa8ff;--side:#f6a94a;--special:#d977ff}
html[data-theme=dark]{--bg:#080d17;--panel:#101827;--text:#ecf3ff;--muted:#9daac0;--line:#26334a;--accent:#9b87ff;--accent2:#26d6ab;--shadow:0 20px 55px rgba(0,0,0,.38);--food:#3ee59b;--drink:#55b6ff;--side:#ffb65c;--special:#df88ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 32%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand h1{margin:0;font-size:clamp(25px,4vw,40px);letter-spacing:-.04em}.brand p{margin:4px 0 0;color:var(--muted)}button,input{font:inherit}.theme{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:14px;cursor:pointer;box-shadow:var(--shadow)}.search{position:relative;margin:16px 0}.search input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:15px 18px 15px 45px;outline:none;box-shadow:var(--shadow)}.search span{position:absolute;left:17px;top:14px}.days,.meals{display:grid;gap:9px}.days{grid-template-columns:repeat(7,1fr);margin:18px 0}.day,.meal{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:11px 8px;cursor:pointer;font-weight:800}.day small{display:block;color:var(--muted);font-weight:600}.day.active,.meal.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}.meals{grid-template-columns:repeat(3,1fr);margin-bottom:18px}.meal{padding:14px}.meal span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.summary{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:18px 2px}.summary h2{margin:0;font-size:24px}.summary p{margin:3px 0 0;color:var(--muted)}.legend{display:flex;gap:8px;flex-wrap:wrap}.legend i{font-style:normal;padding:5px 9px;border-radius:999px;border:1px solid;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 97%,white),var(--panel));border:1px solid var(--line);border-left:4px solid var(--food);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-height:110px}.card.drink{border-left-color:var(--drink)}.card.side{border-left-color:var(--side)}.card.special{border-left-color:var(--special)}.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin:0 0 10px}.dish{font-size:17px;font-weight:800}.empty{color:var(--muted);font-style:italic}.resultMsg{display:none;background:var(--panel);padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px}.footer{color:var(--muted);font-size:12px;text-align:center;padding:28px 0}@media(max-width:760px){.wrap{padding:16px}.days{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr 1fr}.summary{align-items:start;flex-direction:column}}@media(max-width:480px){.days{grid-template-columns:repeat(4,1fr)}.day{font-size:12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.theme{white-space:nowrap}}

/* Simplified menu list */
.grid{display:block;background:#dfe5ec;border:1px solid #8e99a8;border-radius:18px;padding:10px 18px;box-shadow:var(--shadow)}
html[data-theme=dark] .grid{background:#b9c2cc;border-color:#66717f}
.card,.card.drink,.card.side,.card.special{display:list-item;list-style-position:inside;background:transparent!important;border:0!important;border-bottom:1px solid rgba(0,0,0,.12)!important;border-radius:0!important;padding:13px 5px!important;box-shadow:none!important;min-height:0!important;color:#000!important}
.card:last-child{border-bottom:0!important}.card h3{display:none!important}.dish{display:inline;font-size:16px!important;font-weight:800!important;color:#000!important;text-transform:uppercase;letter-spacing:.025em}.dish+.dish:before{content:' / ';}.empty{display:inline;color:#000!important;text-transform:uppercase;font-weight:700;font-style:normal!important}.legend{display:none!important}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand"><h1>Mess Menu Explorer</h1><p>Pick a day, choose a meal, or search directly.</p></div><button class="theme" id="themeBtn" aria-label="Toggle theme">☀️ Light</button></header>
<div class="search"><span>⌕</span><input id="search" placeholder="Try “Sunday dinner”, “Tuesday breakfast” or “biryani”…" autocomplete="off"></div>
<nav class="days" id="days" aria-label="Choose day"></nav>
<nav class="meals" id="meals" aria-label="Choose meal"></nav>
<div class="resultMsg" id="resultMsg"></div>
<section class="summary"><div><h2 id="title"></h2><p id="time"></p></div></section>
<section class="grid" id="grid"></section><div class="footer">Designed for quick mobile use • Menu from the supplied college PDF</div>
</main><script>
const MENU={"Monday": {"Breakfast": {"Hot Preparation": ["Dhokla"], "Side Accompaniment": ["Green Chutney"], "Egg Item": ["Boiled Egg"], "Bread Counter": ["Bread Butter Jam"], "Healthy Counter": ["Cornflakes"], "Fruit": ["Banana"], "Beverage": ["Tea / Coffee / Milk"]}, "Lunch": {"Salad": ["Mixed Salad w/ Onion"], "Beverage": ["Buttermilk"], "Dry Veg": ["Aloo Gobhi Mutter Dry"], "Gravy Veg": ["Rajma Masala"], "Non Veg": [], "Dal": ["Dal Tadka"], "Bread": ["Roti"], "Rice": ["Jeera Rice"], "Papad / Pickle": ["Papad"]}, "Dinner": {"Salad": ["Mixed Salad"], "Soup / Curd": ["Curd"], "Dry Veg": ["Aloo Jeera"], "Veg Gravy": ["Paneer Butter Masala"], "Non Veg": ["Chicken Butter Masala"], "Bread": ["Butter Roti"], "Rice": ["Ghee Rice"], "Dal": ["Hari Moong Dal"], "Side Dish": ["Payasam"]}}, "Tuesday": {"Breakfast": {"Hot Preparation": ["Idli Medu Vada"], "Side Accompaniment": ["Sambar & Coconut Chutney"], "Egg Item": [], "Bread Counter": ["Bread Butter Jam"], "Healthy Counter": ["Sprouts"], "Fruit": [], "Beverage": ["Tea / Coffee / Milk"]}, "Lunch": {"Salad": ["Onion-Cucumber Salad"], "Beverage": ["Sweet Lassi"], "Dry Veg": ["Jeera Aloo"], "Gravy Veg": ["Chole"], "Non Veg": [], "Dal": ["Dal Fry"], "Bread": ["Poori"], "Rice": ["Jeera Rice"], "Papad / Pickle": ["Fryums"]}, "Dinner": {"Salad": ["Green Salad w/ Onion"], "Soup / Curd": ["Buttermilk"], "Dry Veg": ["Gobi Matar"], "Veg Gravy": ["Rajma Masala"], "Non Veg": [], "Bread": ["Roti"], "Rice": ["Jeera Rice"], "Dal": ["Dal Fry"], "Side Dish": ["Papad"]}}, "Wednesday": {"Breakfast": {"Hot Preparation": ["Vada Pav"], "Side Accompaniment": ["Mint Chutney"], "Egg Item": ["Boiled Egg"], "Bread Counter": ["Bread Butter Jam"], "Healthy Counter": ["Cornflakes"], "Fruit": ["Papaya"], "Beverage": ["Tea / Coffee / Milk"]}, "Lunch": {"Salad": ["Salad"], "Beverage": ["Jaljeera"], "Dry Veg": ["Corn & Peas Palak"], "Gravy Veg": ["Veg Manchurian Gravy"], "Non Veg": [], "Dal": ["Mix Dal Tadka"], "Bread": ["Roti"], "Rice": ["Veg Pulao"], "Papad / Pickle": ["Papad"]}, "Dinner": {"Salad": ["Mixed Salad"], "Soup / Curd": ["Soup (Chef's Choice)"], "Dry Veg": [], "Veg Gravy": ["Chilli Paneer"], "Non Veg": ["Chilli Chicken"], "Bread": ["Roti"], "Rice": ["Veg Fried Rice"], "Dal": ["Panchratan Dal"], "Side Dish": ["Fryums"]}}, "Thursday": {"Breakfast": {"Hot Preparation": ["Onion Uttapam"], "Side Accompaniment": ["Sambar & Coconut Chutney"], "Egg Item": [], "Bread Counter": ["Bread Butter Jam"], "Healthy Counter": ["Sprouts"], "Fruit": [], "Beverage": ["Tea / Coffee / Milk"]}, "Lunch": {"Salad": ["Kachumber Salad"], "Beverage": ["Aam Panna"], "Dry Veg": ["Cabbage Aloo Sabzi"], "Gravy Veg": ["Kala Chana Curry"], "Non Veg": [], "Dal": ["Dal Tadka"], "Bread": ["Roti"], "Rice": ["Plain Rice"], "Papad / Pickle": ["Papad"]}, "Dinner": {"Salad": ["Mixed Salad"], "Soup / Curd": ["Tomato Soup"], "Dry Veg": ["Veg Manchurian"], "Veg Gravy": ["Veg Korma"], "Non Veg": [], "Bread": ["Roti"], "Rice": ["Jeera Rice"], "Dal": ["Dal Fry"], "Side Dish": ["Jalebi"]}}, "Friday": {"Breakfast": {"Hot Preparation": ["Besan Chilla"], "Side Accompaniment": ["Green Chutney"], "Egg Item": ["Boiled Egg"], "Bread Counter": ["Bread Butter Jam"], "Healthy Counter": ["Cornflakes"], "Fruit": ["Watermelon"], "Beverage": ["Tea / Coffee / Milk"]}, "Lunch": {"Salad": ["Mixed Salad"], "Beverage": ["Buttermilk"], "Dry Veg": ["Aloo Capsicum"], "Gravy Veg": ["Paneer Chettinad"], "Non Veg": ["Chicken Chettinad"], "Dal": ["Dal Fry"], "Bread": ["Roti"], "Rice": ["Jeera Rice"], "Papad / Pickle": ["Fryums"]}, "Dinner": {"Salad": ["Mixed Salad"], "Soup / Curd": ["Plain Curd"], "Dry Veg": ["Tawa Veg"], "Veg Gravy": ["Veg Kofta Curry"], "Non Veg": [], "Bread": ["Butter Roti"], "Rice": ["Mint Pulao"], "Dal": ["Dal Bukhara"], "Side Dish": ["Papad"]}}, "Saturday": {"Breakfast": {"Hot Preparation": ["Palak Puri, Aloo Bhaji"], "Side Accompaniment": [], "Egg Item": ["Egg Bhurji (one time)"], "Bread Counter": ["Bread Butter Jam"], "Healthy Counter": ["Cornflakes"], "Fruit": ["Mix Fruit Juice"], "Beverage": ["Tea / Coffee / Milk"]}, "Lunch": {"Salad": ["Mixed Salad"], "Beverage": ["Jaljeera"], "Dry Veg": ["Crispy Aloo"], "Gravy Veg": ["Veg Jalfrezi"], "Non Veg": [], "Dal": ["Chana Dal"], "Bread": ["Roti"], "Rice": ["Curd Rice"], "Papad / Pickle": ["Papad"]}, "Dinner": {"Salad": ["Kachumber"], "Soup / Curd": ["Rasam"], "Dry Veg": [], "Veg Gravy": ["Soyabean Curry"], "Non Veg": ["Egg Curry"], "Bread": ["Roti"], "Rice": ["Plain Rice"], "Dal": ["Chana Dal"], "Side Dish": ["Shahi Tukda"]}}, "Sunday": {"Breakfast": {"Hot Preparation": ["Poha"], "Side Accompaniment": [], "Egg Item": ["Boiled Egg"], "Bread Counter": ["Bread Butter Jam"], "Healthy Counter": ["Cornflakes"], "Fruit": [], "Beverage": ["Tea / Coffee / Milk"]}, "Lunch": {"Salad": ["Salad w/ Onion & Chilli"], "Beverage": ["Raita"], "Dry Veg": [], "Gravy Veg": ["Paneer Gravy (veg only)"], "Non Veg": ["Chicken Biryani"], "Dal": [], "Bread": [], "Rice": ["Veg Biryani"], "Papad / Pickle": ["Ice Cream, Chef's Choice"]}, "Dinner": {"Salad": ["Mixed Salad w/ Onion"], "Soup / Curd": ["Boondi Raita"], "Dry Veg": ["Cabbage Thoran"], "Veg Gravy": ["Chola Masala"], "Non Veg": [], "Bread": ["Bhatura"], "Rice": ["Lemon Rice"], "Dal": ["Dal Tadka"], "Side Dish": ["Papad"]}}};
const days=Object.keys(MENU), meals=['Breakfast','Lunch','Dinner'];
const times={Breakfast:'7:30 AM – 10:30 AM',Lunch:'12:30 PM – 2:30 PM',Dinner:'7:30 PM – 10:30 PM'};
const short={Monday:'M',Tuesday:'TU',Wednesday:'W',Thursday:'TH',Friday:'F',Saturday:'SA',Sunday:'S'};
let selectedDay=days[new Date().getDay()===0?6:new Date().getDay()-1], selectedMeal='Breakfast';
const drinkCats=['Beverage','Soup / Curd']; const sideCats=['Side Accompaniment','Bread Counter','Healthy Counter','Fruit','Salad','Bread','Rice','Dal','Papad / Pickle','Side Dish'];
function catClass(c,items){if(drinkCats.includes(c))return'drink';if(['Non Veg','Egg Item'].includes(c)||items.some(x=>/ice cream|jalebi|payasam|shahi tukda|biryani|chicken|egg/i.test(x)))return'special';if(sideCats.includes(c))return'side';return''}
function renderNav(){daysEl.innerHTML=days.map(d=>`<button class="day ${d===selectedDay?'active':''}" data-day="${d}">${short[d]}<small>${d.slice(0,3)}</small></button>`).join('');mealsEl.innerHTML=meals.map(m=>`<button class="meal ${m===selectedMeal?'active':''}" data-meal="${m}">${m}<span>${times[m]}</span></button>`).join('')}
function render(){renderNav(); title.textContent=`${selectedDay} ${selectedMeal}`;time.textContent=times[selectedMeal];const obj=MENU[selectedDay][selectedMeal];grid.innerHTML=Object.values(obj).flat().map(x=>`<article class="card"><span class="dish">${x}</span></article>`).join('') || '<article class="card"><span class="empty">NOT SERVED</span></article>';resultMsg.style.display='none'}
const daysEl=document.getElementById('days'),mealsEl=document.getElementById('meals'),grid=document.getElementById('grid'),title=document.getElementById('title'),time=document.getElementById('time'),resultMsg=document.getElementById('resultMsg'),search=document.getElementById('search');
daysEl.onclick=e=>{const b=e.target.closest('[data-day]');if(b){selectedDay=b.dataset.day;render()}};mealsEl.onclick=e=>{const b=e.target.closest('[data-meal]');if(b){selectedMeal=b.dataset.meal;render()}};
search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();if(!q){render();return}let foundDay=days.find(d=>q.includes(d.toLowerCase())||q.split(/\s+/).includes(short[d].toLowerCase()));let foundMeal=meals.find(m=>q.includes(m.toLowerCase()));if(foundDay){selectedDay=foundDay;if(foundMeal)selectedMeal=foundMeal;render();return}const hits=[];for(const d of days)for(const m of meals)for(const [c,a] of Object.entries(MENU[d][m]))for(const dish of a)if(dish.toLowerCase().includes(q))hits.push({d,m,c,dish});renderNav();title.textContent=`Search results for “${search.value}”`;time.textContent=`${hits.length} match${hits.length===1?'':'es'}`;grid.innerHTML=hits.length?hits.map(x=>`<article class="card"><span class="dish">${x.dish} — ${x.d.toUpperCase()} ${x.m.toUpperCase()}</span></article>`).join(''):'<article class="card"><span class="empty">NO MATCH. TRY A DAY, MEAL, OR DISH NAME.</span></article>'});
document.getElementById('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';document.getElementById('themeBtn').textContent=dark?'🌙 Dark':'☀️ Light';localStorage.setItem('mess-theme',dark?'light':'dark')};const saved=localStorage.getItem('mess-theme');if(saved){document.documentElement.dataset.theme=saved;document.getElementById('themeBtn').textContent=saved==='dark'?'☀️ Light':'🌙 Dark'}render();
</script></body></html>
